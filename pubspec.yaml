name: quotes
description: Offline quotations, invoices and receipts for borehole drilling businesses.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_riverpod: ^3.2.1
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  image_picker: ^1.2.1
  file_picker: ^10.3.7
  fl_chart: ^1.1.1
  intl: ^0.20.2
  cryptography: ^2.7.0
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
  fonts:
    - family: EMBody
      fonts:
        - asset: assets/fonts/EMBody-Regular.ttf
    - family: EMDisplay
      fonts:
        - asset: assets/fonts/EMDisplay-Bold.ttf
          weight: 700
